<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Mappa Campagna Sindaco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar con filtri, avanzamento per Municipio ed elenco; mappa vettoriale a tutta altezza con scheda del luogo sovrapposta. */
:root{
  --bg:#f6f6f6; --panel:#ffffff; --ink:#333333; --muted:#6b6b6b; --line:#e0dede;
  --accent:#f71e44; --accent-ink:#ffffff; --accent-text:#d4153a; --map:#ececec; --zone:#ffffff; --zone-line:#c7c2c2;
  --ok:#2b9a5a; --warn:#b4540a; --shadow:0 6px 24px rgba(15,25,40,.14);
  --f-display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Montserrat","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17101a; --panel:#211620; --ink:#f6f6f6; --muted:#b5a8b0; --line:#3a2a36;
  --accent:#ff4d6a; --accent-ink:#1a0a10; --accent-text:#ff7088; --map:#140d14; --zone:#2a1c28; --zone-line:#503a4b;
  --ok:#4cc38a; --warn:#e8964a; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17101a; --panel:#211620; --ink:#f6f6f6; --muted:#b5a8b0; --line:#3a2a36;
  --accent:#ff4d6a; --accent-ink:#1a0a10; --accent-text:#ff7088; --map:#140d14; --zone:#2a1c28; --zone-line:#503a4b;
  --ok:#4cc38a; --warn:#e8964a; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
#side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:18px}
#side>*+*{margin-top:18px}
h1{font:500 21px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding-bottom:12px;border-bottom:3px solid var(--accent)}
.brand svg{height:26px;width:auto;color:var(--accent);flex:none}
.brand span{font:500 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.tot{margin-top:14px}
.tot-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tot-row b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tot-row span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;width:0}
.filters{display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chp{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:none;font-size:13px;font-weight:500}
.chp em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chp:hover{background:var(--bg)}
.chp[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chp[aria-pressed="true"] em{color:#ffffffd0}
.chp[aria-pressed="true"] .dot{background:#fff!important}
.chp.all{--c:var(--ink)}
.chp.all[aria-pressed="true"]{color:var(--bg)}
.chp.all[aria-pressed="true"] em{color:var(--bg);opacity:.75}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{padding:9px 6px;border:0;background:var(--bg);font-weight:600;font-size:13px;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h2{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.zrow{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border:1px solid var(--line);background:none;border-radius:10px;text-align:left}
.zrow:hover{background:var(--bg)}
.zrow[aria-pressed="true"]{background:var(--bg);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zrow b{font:700 14px/1 var(--f-display)}
.zrow .bar{margin:0;height:5px}
.zrow em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.list{display:flex;flex-direction:column;min-height:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line)}
.item:hover,.item.cur{background:var(--bg)}
.item.cur{box-shadow:inset 3px 0 0 var(--accent)}
.ibody{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:center;padding:9px 6px;border:0;background:none;text-align:left;min-width:0}
.chk{width:34px;height:34px;margin-right:4px;border-radius:50%;border:1.5px solid var(--line);background:none;color:transparent;font-size:16px;font-weight:700;line-height:1}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.item .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{font-size:12px;font-weight:600;color:var(--ok)}
.more{margin-top:10px;padding:9px;border:1px solid var(--line);border-radius:8px;background:none}
.empty{color:var(--muted);padding:14px 4px}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--map);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;--u:.3}
#map.add{cursor:crosshair}
#map.grab{cursor:grabbing}
#map3d{position:absolute;left:0;right:0;bottom:0;top:56px;width:100%;height:calc(100% - 56px);border:0;display:block;background:var(--map)}
#map3d[hidden]{display:none}
.m3d .ctl{z-index:3}.m3d .vsw{flex-direction:row}.m3d #zIn,.m3d #zOut,.m3d #zAll,.m3d .addbtn,.m3d .progleg{display:none}
.m3d .card{top:68px;max-height:calc(100% - 80px);margin-right:56px}
@media (max-width:820px){.m3d #map3d{bottom:104px;height:calc(100% - 160px)}.m3d .card{margin-right:0;top:auto;max-height:70vh}}
.zone{fill:var(--zone);stroke:var(--zone-line);stroke-width:calc(var(--u)*1.2*1px);stroke-linejoin:round;cursor:pointer}
.zone:hover{fill:color-mix(in srgb,var(--zone) 82%,var(--accent))}
.zone.sel{stroke:var(--accent);stroke-width:calc(var(--u)*2.4*1px)}
.zone.dim{opacity:.55}
.zlab{font:700 calc(var(--u)*34*1px)/1 var(--f-display);fill:var(--muted);opacity:.28;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lm{font:600 calc(var(--u)*10.5*1px)/1 var(--f-body);fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--zone);stroke-width:calc(var(--u)*3*1px)}
.lmk{fill:var(--muted);pointer-events:none}
.pt{r:calc(var(--u)*5.5*1px);stroke:var(--panel);stroke-width:calc(var(--u)*1.5*1px);cursor:pointer}
.pt.v{opacity:.5;stroke:var(--ok);stroke-width:calc(var(--u)*2.4*1px)}
.selring{fill:none;stroke:var(--ink);stroke-width:calc(var(--u)*2.4*1px);r:calc(var(--u)*10*1px);pointer-events:none}
.draft{fill:var(--accent);stroke:var(--panel);stroke-width:calc(var(--u)*2*1px);r:calc(var(--u)*7*1px);pointer-events:none}
.ctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:18px;line-height:1;box-shadow:var(--shadow)}
.addbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{position:absolute;left:12px;top:60px;max-width:260px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.hint.h3{top:auto;bottom:12px;max-width:min(360px,calc(100% - 80px))}
.vsw{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.ctl .vsw button{width:36px;height:34px;border:0;border-radius:0;box-shadow:none;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
.ctl .vsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tip{position:absolute;pointer-events:none;z-index:5;padding:5px 9px;background:var(--ink);color:var(--bg);border-radius:6px;font-size:12px;max-width:260px;transform:translate(-50%,-130%);white-space:nowrap}
.card{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;bottom:auto;width:min(340px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;z-index:6;margin-right:48px}
.card[hidden]{display:none}
.card h3{font:700 18px/1.2 var(--f-display);margin:6px 0 2px;padding-right:28px}
.card .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border:0;background:none;border-radius:6px;font-size:20px;line-height:1;color:var(--muted)}
.card .x:hover{background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.meta{color:var(--muted);font-size:13px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:10px;border:0;background:var(--bg);font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button:disabled{opacity:.6;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.fld textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{padding:9px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.link{color:var(--accent-text);font-size:13px}
.saved{font-size:12px;color:var(--muted);margin-left:auto}
.ro{margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.grip{display:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{min-height:32px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:none;font-size:12px;font-weight:600;color:var(--ink)}
.quick button b{font-variant-numeric:tabular-nums;color:var(--warn)}
.quick button:hover{background:var(--bg)}
.mf summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 4px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
.mf summary::-webkit-details-marker{display:none}
.mf summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-3px 6px 0 0}
.mf[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.mf summary em{font-style:normal;margin-left:auto;margin-right:10px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px}
.mf .seg3{margin-bottom:8px}
.cl{fill:var(--ink);stroke:var(--panel);stroke-width:calc(var(--u)*2*1px);cursor:pointer;r:calc(var(--u)*11*1px)}
.cln{font:700 calc(var(--u)*10*1px)/1 var(--f-body);fill:var(--bg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
@media (max-width:820px){
  html,body{height:100%;overflow:hidden}
  #app{display:block;height:100dvh;position:relative}
  #mapwrap{position:absolute;inset:0;height:auto}
  #side{position:fixed;left:0;right:0;bottom:0;height:80dvh;z-index:5;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(15,25,40,.18);transform:translateY(calc(100% - 104px));padding-top:0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #side.open{transform:none}
  .grip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:sticky;top:0;z-index:2;width:calc(100% + 32px);margin:0 -16px;min-height:44px;border:0;background:var(--panel);border-radius:16px 16px 0 0;font-size:12px;font-weight:600;color:var(--muted)}
  .grip i{width:36px;height:4px;border-radius:2px;background:var(--line)}
  .chp,.seg3 button,.seg4 button,.quick button{min-height:44px}
  .chk{width:44px;height:44px}
  .ctl button,.ctl .vsw button{width:44px;height:44px}
  .tbtn,.addbtn{min-height:44px}
  .card{z-index:8}
  .hint:not(.h3){display:none}
  .card{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:70vh;margin:0;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}@media (max-width:820px){#side{transition:transform .25s ease-out}}}
.tb{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 64px);z-index:2}
.addbtn,.tbtn{padding:9px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:600;box-shadow:var(--shadow)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.progleg{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
.progleg i{display:block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--zone),color-mix(in srgb,var(--zone) 20%,var(--ok)));border:1px solid var(--line)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg4 button{padding:9px 4px;border:0;background:var(--bg);font-weight:600;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.seg4 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg4 button:disabled{opacity:.6;cursor:not-allowed}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ct input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.ct #cTel{grid-column:1/-1}
.fld textarea.short{min-height:70px}
#hist{display:flex;flex-direction:column;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.vi{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.vh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.vh b{color:var(--ink);font-weight:600}
.vdel{margin-left:auto;width:24px;height:24px;border:0;background:none;border-radius:6px;font-size:16px;line-height:1;color:var(--muted)}
.vdel:hover{background:var(--line)}
.vt{margin-top:4px;font-size:13px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.fld input[type=date]{max-width:200px}
.pr{color:var(--warn);font-weight:700}
.late{color:var(--warn);font-weight:600}
.mu{color:var(--muted)}
.zone.p{transition:fill .3s}
.pt.hp{stroke:var(--ink);stroke-width:calc(var(--u)*2.2*1px)}
.rt{fill:none;stroke:var(--accent);stroke-width:calc(var(--u)*2.4*1px);stroke-dasharray:calc(var(--u)*7*1px) calc(var(--u)*5*1px);stroke-linejoin:round;pointer-events:none}
.rtc{r:calc(var(--u)*8*1px);fill:var(--accent);stroke:var(--panel);stroke-width:calc(var(--u)*2*1px);pointer-events:none}
.rtn{font:700 calc(var(--u)*10*1px)/1 var(--f-body);fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rl{list-style:none;margin:0 0 6px;padding:0}
.rl li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line)}
.rname{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;padding:7px 4px;border:0;background:none;text-align:left}
.rname b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rname small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.rx{width:30px;height:30px;border:0;background:none;border-radius:6px;font-size:18px;color:var(--muted)}
.rx:hover{background:var(--bg)}
.dash{position:absolute;left:12px;top:56px;bottom:12px;width:min(540px,calc(100% - 72px));overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;z-index:7}
.dash h2{margin-top:18px}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh h2{margin:0;font:700 18px/1.2 var(--f-display);text-transform:none;letter-spacing:0;color:var(--ink)}
.dash .x{position:static;width:30px;height:30px;border:0;background:none;border-radius:6px;font-size:20px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.kpi b{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;color:var(--muted);font-weight:600}
.kpi span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.25}
.kpi.hot b{color:var(--warn)}
.dz{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:54px 1fr 92px 54px 66px;gap:8px;align-items:center;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13px}
.drow:hover,.dli:hover{background:var(--bg)}
.drow b{font-weight:600}
.drow .bar{margin:0;height:6px}
.drow em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.drow span:not(.bar){font-size:12px;text-align:right}

const LAT0=45.56,LON0=9.0,KX=Math.cos(45.47*Math.PI/180)*1000;

/* ---------- geometria ---------- */
function inRing(lon,lat,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>lat)!==(b[1]>lat)&&lon<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function munOf(lon,lat){for(const m of MUN){for(const r of m.rings){if(inRing(lon,lat,r))return m.n}}return 0}
const ZONES=MUN.map(m=>{
  const d=m.rings.map(r=>'M'+r.map(p=>px(p[0]).toFixed(2)+','+py(p[1]).toFixed(2)).join('L')+'Z').join('');
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,sx=0,sy=0,sa=0;
  m.rings.forEach(r=>{for(let i=0;i<r.length;i++){const a=r[i],b=r[(i+1)%r.length];const ax=px(a[0]),ay=py(a[1]),bx=px(b[0]),by=py(b[1]);x0=Math.min(x0,ax);x1=Math.max(x1,ax);y0=Math.min(y0,ay);y1=Math.max(y1,ay);const cr=ax*by-bx*ay;sa+=cr;sx+=(ax+bx)*cr;sy+=(ay+by)*cr}});
  const cx=sx/(3*sa),cy=sy/(3*sa);
  return {n:m.n,d,box:[x0,y0,x1-x0,y1-y0],cx:isFinite(cx)?cx:(x0+x1)/2,cy:isFinite(cy)?cy:(y0+y1)/2};
});
const ALLBOX=(()=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ZONES.forEach(z=>{x0=Math.min(x0,z.box[0]);y0=Math.min(y0,z.box[1]);x1=Math.max(x1,z.box[0]+z.box[2]);y1=Math.max(y1,z.box[1]+z.box[3])});return [x0,y0,x1-x0,y1-y0]})();

const svg=$('#map');

function clCell(){const c=46*vb.w/(svg.clientWidth||800);return c<2.2?0:Math.pow(1.6,Math.round(Math.log(c)/Math.log(1.6)))}
let clKey=null;
function applyVB(){
  const cw=svg.clientWidth||800,ch=svg.clientHeight||600;
  const aspect=cw/ch;
  if(vb.w/vb.h<aspect){vb.w=vb.h*aspect}else{vb.h=vb.w/aspect}
  svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  svg.style.setProperty('--u',(vb.w/cw).toFixed(5));
  try{if(mode!=='3d'){const k=clCell();if(k!==clKey){clKey=k;requestAnimationFrame(drawMap)}}}catch(_){}
}
function fit(b,pad){pad=pad||.06;const cw=svg.clientWidth||800,ch=svg.clientHeight||600;let w=b[2]*(1+pad*2),h=b[3]*(1+pad*2);const a=cw/ch;if(w/h<a)w=h*a;else h=w/a;vb={x:b[0]+b[2]/2-w/2,y:b[1]+b[3]/2-h/2,w,h};applyVB()}
function toUser(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(cx,cy,f){const p=toUser(cx,cy);const nw=Math.min(Math.max(vb.w*f,6),ALLBOX[2]*2.2);f=nw/vb.w;vb={x:p.x-(p.x-vb.x)*f,y:p.y-(p.y-vb.y)*f,w:nw,h:vb.h*f};applyVB()}
function centerOn(x,y,w){const f=w/vb.w;vb={x:x-w/2,y:y-vb.h*f/2,w,h:vb.h*f};applyVB()}

const ptrs=new Map();let drag=null,pinch=null,moved=false;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(ptrs.size===1){drag={x:e.clientX,y:e.clientY}}else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);drag=null}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0){const r=svg.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch/d);pinch=d;moved=true}return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)<5)return;
    if(!moved){moved=true;svg.classList.add('grab');try{svg.setPointerCapture(e.pointerId)}catch(_){}}
    const u=vb.w/svg.clientWidth*(svg.clientWidth*0+1);const s=Math.max(vb.w/svg.clientWidth,vb.h/svg.clientHeight);
    vb.x-=(e.clientX-prev.x)*s;vb.y-=(e.clientY-prev.y)*s;applyVB()}
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){drag=null;svg.classList.remove('grab')}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.pow(1.0016,e.deltaY))},{passive:false});

$('#zOut').onclick=()=>zoomBtn(1.6);

  const t=e.target;
  if(PL.pick){const p=toUser(e.clientX,e.clientY);plPicked(unX(p.x),unY(p.y));return}
  if(addMode){const p=toUser(e.clientX,e.clientY);const lon=unX(p.x),lat=unY(p.y);if(!munOf(lon,lat)){toast('Il punto è fuori dai confini di Milano.');return}draft={lat,lon,mun:munOf(lon,lat)};renderCard();drawMap();return}
  if(t.classList&&t.classList.contains('cl')){centerOn(+t.dataset.cx,+t.dataset.cy,Math.max(vb.w*.4,6));return}
  if(t.classList&&t.classList.contains('pt')){select(t.dataset.id,false);return}
  if(t.classList&&t.classList.contains('zone')){const n=+t.dataset.n;setZone(F.zone===n?0:n);return}
});

function drawMap(){
  if(mode==='3d'){sync3();return}
  let s='';
  const sel=F.zone;
  const zp=F.prog?zonePct():null;
  ZONES.forEach(z=>{const fl=zp?` style="fill:color-mix(in srgb,var(--zone) ${100-Math.round(progMix(zp[z.n])*100)}%,var(--ok))"`:'';s+=`<path class="zone${sel&&sel===z.n?' sel':''}${sel&&sel!==z.n?' dim':''}" data-n="${z.n}"${fl} d="${z.d}"/>`});
  ZONES.forEach(z=>{s+=`<text class="zlab" x="${z.cx.toFixed(1)}" y="${z.cy.toFixed(1)}">${z.n}</text>`});
  LANDMARKS.forEach(l=>{const x=px(l[2]),y=py(l[1]);s+=`<rect class="lmk" x="${x-.45}" y="${y-.45}" width=".9" height=".9" transform="rotate(45 ${x} ${y})" style="width:calc(var(--u)*7*1px);height:calc(var(--u)*7*1px);transform-box:fill-box;transform-origin:center"/><text class="lm" x="${x+1.6}" y="${y+.9}">${l[0]}</text>`});
  const list=scope({});
  const cell=clCell(),cg=new Map(),solo=[];
  if(cell>0){list.forEach(p=>{if(p.id===selId||route.includes(p.id)){solo.push(p);return}const k=Math.floor(p.x/cell)+'_'+Math.floor(p.y/cell);let g=cg.get(k);if(!g)cg.set(k,g=[]);g.push(p)});
    cg.forEach(g=>{if(g.length===1)solo.push(g[0]);else{const cx=g.reduce((a,p)=>a+p.x,0)/g.length,cy=g.reduce((a,p)=>a+p.y,0)/g.length;s+=`<circle class="cl" data-cx="${cx.toFixed(2)}" data-cy="${cy.toFixed(2)}" cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="1"><title>${g.length} luoghi: tocca per ingrandire</title></circle><text class="cln" x="${cx.toFixed(2)}" y="${cy.toFixed(2)}">${g.length}</text>`}})}
  const sset=cell>0?new Set(solo):null;
  const todo=list.filter(p=>!isDone(p)&&(!sset||sset.has(p))),done=list.filter(p=>isDone(p)&&(!sset||sset.has(p)));
  done.forEach(p=>{s+=`<circle class="pt v${sOf(p).prio==='alta'?' hp':''}" data-id="${esc(p.id)}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="1" style="fill:${CAT[p.cat].color}"/>`});
  todo.forEach(p=>{s+=`<circle class="pt${sOf(p).prio==='alta'?' hp':''}" data-id="${esc(p.id)}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="1" style="fill:${CAT[p.cat].color}"/>`});
  const rp=routePlaces(),pp=planPts();
  if(pp.length>1)s+=`<polyline class="rt" points="${pp.map(p=>p.x.toFixed(2)+','+p.y.toFixed(2)).join(' ')}"/>`;
  if(rp.length&&PL.snap){const a=pp[0];s+=`<circle class="rts" cx="${a.x.toFixed(2)}" cy="${a.y.toFixed(2)}" r="1"><title>Partenza: ${esc(PL.snap.start.label||'')}</title></circle><text class="rtn" x="${a.x.toFixed(2)}" y="${a.y.toFixed(2)}">P</text>`}
  rp.forEach((p,i)=>{s+=`<circle class="rtc" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="1"/><text class="rtn" x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}">${i+1}</text>`});
  const sp=ALL.find(p=>p.id===selId);
  if(sp)s+=`<circle class="selring" cx="${sp.x.toFixed(2)}" cy="${sp.y.toFixed(2)}" r="3"/>`;
  if(draft)s+=`<circle class="draft" cx="${px(draft.lon).toFixed(2)}" cy="${py(draft.lat).toFixed(2)}" r="3"/>`;
  svg.innerHTML=s;
}
function drawZones(){
  const base=scope({zone:true,state:true});
  const by={};base.forEach(p=>{const b=by[p.mun]||(by[p.mun]={n:0,d:0});b.n++;if(isDone(p))b.d++});
  const bt=base.length,bd=base.filter(isDone).length;
  $('#zones').innerHTML=`<button class="zrow tutti" data-n="0" aria-pressed="${!F.zone}" aria-label="Tutta Milano: ${bd} visti su ${bt}"><b>Tutti</b><span class="bar"><i style="width:${bt?Math.round(100*bd/bt):0}%"></i></span></button>`+ZONES.map(z=>{const b=by[z.n]||{n:0,d:0};const pc=b.n?Math.round(100*b.d/b.n):0;return `<button class="zrow" data-n="${z.n}" aria-pressed="${F.zone===z.n}" aria-label="Municipio ${z.n}: ${b.d} visti su ${b.n}" title="${b.d} / ${b.n}"><b>${z.n}</b><span class="bar"><i style="width:${pc}%"></i></span></button>`}).join('');
  const zb=F.zone?(by[F.zone]||{n:0,d:0}):null;
  $('#zcap').textContent=zb?`Municipio ${F.zone}: ${zb.d} visti su ${zb.n}`:'Tocca un numero per vedere solo quel Municipio.';
  const tn=base.length,td=base.filter(isDone).length;
  $('#totN').textContent=td;
  $('#totL').textContent='visti su '+tn+(F.cat!=='all'?' · '+CAT[F.cat].label:'');
  $('#totBar').style.width=(tn?100*td/tn:0)+'%';
  const all=ALL.filter(p=>!isHidden(p)),td0=today();
  const nRec=all.filter(p=>sOf(p).recall&&sOf(p).recall<=td0).length,nAlta=all.filter(p=>sOf(p).prio==='alta'&&!isDone(p)).length;
  $('#quick').innerHTML=(nRec?`<button data-x="recall"><b>${nRec}</b> da richiamare</button>`:'')+(nAlta?`<button data-x="alta"><b>${nAlta}</b> alta priorità da vedere</button>`:'');
  const na=(F.extra!=='all')+0;const mn=$('#mfN');mn.hidden=!na;mn.textContent=na;
}
function drawList(){
  const l=scope({}).sort(F.extra==='recall'?(a,b)=>(sOf(a).recall||'').localeCompare(sOf(b).recall||'')||a.name.localeCompare(b.name,'it'):(a,b)=>a.name.localeCompare(b.name,'it'));
  $('#listH').textContent=l.length+(l.length===1?' luogo':' luoghi');
  if(!l.length){$('#list').innerHTML='<div class="empty"><div><b>Nessun luogo trovato</b>Prova a cambiare la ricerca o a togliere un filtro.</div><button class="btn" id="fReset">Azzera i filtri</button></div>';return}
  const part=l.slice(0,shown);
  $('#list').innerHTML=part.map(p=>{const d=isDone(p);return `<div class="item${p.id===selId?' cur':''}"><button class="ibody" data-id="${esc(p.id)}"><span class="nm">${esc(p.name)}</span><span class="mt"><i class="dot" style="background:${CAT[p.cat].color}"></i><span>${CAT[p.cat].label} · Mun. ${p.mun}${extra(p)}</span></span></button>${canEdit()?`<button class="chk" data-id="${esc(p.id)}" aria-pressed="${d}" aria-label="${d?'Visto, tocca per annullare':'Segna come visto'}" title="${d?'Visto, tocca per annullare':'Segna come visto'}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>`:(d?'<span class="tick">Visto</span>':'')}</div>`}).join('')+(l.length>shown?`<button class="more" id="more">Mostra altri ${Math.min(200,l.length-shown)}</button>`:'');
}
function drawFilters(){
  const cnt={};ALL.filter(p=>!isHidden(p)).forEach(p=>cnt[p.cat]=(cnt[p.cat]||0)+1);
  const total=Object.values(cnt).reduce((a,b)=>a+b,0);
  $('#chips').innerHTML=`<button class="chp all" data-c="all" aria-pressed="${F.cat==='all'}"><span class="nm">Mostra tutti i tipi</span><em>${total}</em></button>`+CATS.map(c=>`<button class="chp" data-c="${c[0]}" style="--c:${c[2]}" aria-pressed="${F.cat===c[0]}"><i class="dot" style="background:${c[2]}"></i><span class="nm">${c[1]}</span><em>${cnt[c[0]]||0}</em></button>`).join('');
  const v=$('#catV');v.textContent=F.cat==='all'?'Tutti':CAT[F.cat].label;v.classList.toggle('on',F.cat!=='all');
}

function renderCard(){
  if(draft){
    card.hidden=false;
    card.innerHTML=`<button class="x" id="cx" aria-label="Chiudi">×</button><span class="chip">Nuovo luogo · Municipio ${draft.mun}</span><h3>Aggiungi un luogo</h3>
    <label class="fld">Nome<input id="nName" type="text" maxlength="120" placeholder="es. Centro culturale di quartiere"></label>
    <label class="fld">Tipo<select id="nCat">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></label>
    <label class="fld">Indirizzo (facoltativo)<input id="nStreet" type="text" maxlength="120"></label>
    <div class="row"><button class="btn pri" id="nSave">Salva luogo</button><button class="btn" id="nCancel">Annulla</button></div>`;
    $('#cx').onclick=()=>{draft=null;card.hidden=true;drawMap()};
    $('#nCancel').onclick=()=>{draft=null;card.hidden=true;drawMap()};
    $('#nSave').onclick=saveNew;
    return;
  }
  const p=ALL.find(q=>q.id===selId);
  if(!p){card.hidden=true;return}
  card.hidden=false;
  card.innerHTML=placeHTML(p);
  bindPlace(p);
}
function bindPlace(p){
  $('#cx').onclick=closeCard;
  $('#bRoute').onclick=()=>toggleRoute(p.id);
  $('#hist').onclick=e=>{const b=e.target.closest('.vdel');if(b)delVisit(b.dataset.id)};
  if(!canEdit())return;
  const saved=t=>{const e=$('#saved');if(e)e.textContent=t};
  $('#bTodo').onclick=()=>{patch(p.id,{v:false});saved('Salvato');syncAfterEdit()};
  $('#bDone').onclick=()=>{patch(p.id,{v:true,at:sOf(p).at||today()});saved('Salvato');syncAfterEdit()};
  $('#cDate').onchange=e=>{patch(p.id,{at:e.target.value});saved('Salvato')};
  $('#cRecall').onchange=e=>{patch(p.id,{recall:e.target.value});saved('Salvato');drawList();drawMap();drawDash()};
  $('#prio').onclick=e=>{const b=e.target.closest('button');if(!b)return;patch(p.id,{prio:b.dataset.p});saved('Salvato');syncAfterEdit()};
  const txt=(sel,key)=>{const el=$(sel);let t=null;const flush=()=>{clearTimeout(t);if((sOf(p)[key]||'')!==el.value){patch(p.id,{[key]:el.value});saved('Salvato')}};el.oninput=()=>{saved('…');clearTimeout(t);t=setTimeout(flush,700)};el.onblur=flush};
  txt('#cNote','note');txt('#cName','cn');txt('#cRole','cr');txt('#cTel','cp');
  const hSave=()=>{const o=$('#hOpen').value,c=$('#hClose').value,er=$('#hErr');if(o&&c&&c<=o){er.textContent='L\'orario di chiusura deve essere dopo quello di apertura.';return}er.textContent='';patch(p.id,{ho:o,hc:c});saved('Salvato')};
  $('#hOpen').onchange=hSave;$('#hClose').onchange=hSave;
  $('#hDays').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));patch(p.id,{hd:[...$('#hDays').children].filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.d).join('')});saved('Salvato')};
  const hc=$('#hClr');if(hc)hc.onclick=()=>{patch(p.id,{ho:'',hc:'',hd:''});saved('Salvato');renderCard()};
  $('#vAdd').onclick=()=>addVisit(p);
  let armed=false;
  $('#bDel').onclick=function(){
    if(!armed){armed=true;this.textContent=p.custom?'Conferma: elimina':'Conferma: rimuovi';return}
    if(p.custom){db.doc('custom/'+p.id).delete().catch(()=>toast('Eliminazione non riuscita.'));db.doc('places/'+p.id).delete().catch(()=>{})}
    else{patch(p.id,{hidden:true})}
    closeCard();
  };
}
function addVisit(p){
  const ta=$('#vText'),text=ta.value.trim();
  if(!text){toast('Scrivi cosa è emerso nell\'incontro.');return}
  const at=$('#vDate').value||today();
  const id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const d={pid:p.id,at,by:uid||'',text};
  visits.set(id,d);ta.value='';
  db.doc('visits/'+id).set(d).catch(()=>{visits.delete(id);histRefresh();toast('Incontro non salvato. Riprova.')});
  if(!sOf(p).v){patch(p.id,{v:true,at:at});syncAfterEdit()}
  histRefresh();drawDash();
}
function delVisit(id){visits.delete(id);if(db)db.doc('visits/'+id).delete().catch(()=>toast('Eliminazione non riuscita.'));histRefresh();drawDash()}
function syncAfterEdit(){drawZones();drawList();drawMap();syncCard();drawDash()}
function syncCard(){ // dopo un aggiornamento dal db: non sovrascrive il campo che si sta scrivendo
  if(draft)return;
  const p=ALL.find(q=>q.id===selId);
  if(!p){if(selId){selId=null;card.hidden=true}return}
  const a=document.activeElement;
  if(card.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){histRefresh();return}
  renderCard();
}
function extra(p){const s=sOf(p);return (s.prio==='alta'?' · <b class="pr">Alta priorità</b>':'')+(s.recall?` · <span class="${late(s)?'late':''}">richiamo ${fmtDate(s.recall)}</span>`:'')}
async function saveNew(){
  const name=$('#nName').value.trim();if(!name){toast('Scrivi il nome del luogo.');return}
  const c={cat:$('#nCat').value,name,lat:+draft.lat.toFixed(6),lon:+draft.lon.toFixed(6),street:$('#nStreet').value.trim()};
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{await db.doc('custom/'+id).set(c)}catch(e){toast('Luogo non salvato. Riprova.');return}

let route=[];try{route=JSON.parse(localStorage.getItem('mdv_route')||'[]')}catch(_){route=[]}
const placeById=id=>ALL.find(p=>p.id===id);
const routePlaces=()=>route.map(placeById).filter(Boolean);
function kmBetween(a,b){const t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t,x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function saveRoute(){
  try{localStorage.setItem('mdv_route',JSON.stringify(route))}catch(_){}
  if(typeof PL!=='undefined')plRouteChanged();
  drawRoute();drawMap();sync3();
  const b=$('#bRoute');if(b&&selId)b.textContent=route.includes(selId)?'Nel giro · togli':'＋ Aggiungi al giro';
}
function toggleRoute(id){
  const i=route.indexOf(id);
  if(i>=0)route.splice(i,1);else route.push(id)
  saveRoute();
}
function sortRoute(){
  const l=routePlaces();if(l.length<3)return;
  const out=[l.shift()];
  while(l.length){const last=out[out.length-1];let bi=0,bd=1e9;l.forEach((p,i)=>{const d=kmBetween(last,p);if(d<bd){bd=d;bi=i}});out.push(l.splice(bi,1)[0])}
  route=out.map(p=>p.id);saveRoute();
}
function mapsUrl(l){
  const c=p=>p.lat+','+p.lon;
  if(l.length===1)return 'https://www.google.com/maps/search/?api=1&query='+c(l[0]);
  let u='https://www.google.com/maps/dir/?api=1&origin='+c(l[0])+'&destination='+c(l[l.length-1]);
  if(l.length>2)u+='&waypoints='+l.slice(1,-1).map(c).join('%7C');
  return u;
}
function drawRoute(){
  const l=routePlaces();$('#routeSec').hidden=!l.length;if(!l.length)return;
  let km=0;for(let i=1;i<l.length;i++)km+=kmBetween(l[i-1],l[i]);
  $('#routeH').textContent='Giro di visite · '+l.length+(l.length===1?' tappa':' tappe');
  $('#route').innerHTML=`<ol class="rl">${l.map((p,i)=>`<li><button class="rname" data-id="${esc(p.id)}"><b>${i+1}</b><span>${esc(p.name)}<small>Municipio ${p.mun}</small></span></button><button class="rx" data-id="${esc(p.id)}" aria-label="Togli dal giro">×</button></li>`).join('')}</ol>
  <p class="meta">${l.length>1?'≈ '+km.toFixed(1).replace('.',',')+' km in linea d\'aria':'Aggiungi altre tappe dalla scheda di un luogo.'}</p>
  <div class="row">${mapsLinks(planPoints(l)).map((u,i,a)=>`<a class="btn pri" target="_blank" rel="noopener" href="${u}">${a.length>1?'Google Maps · parte '+(i+1)+' di '+a.length:'Apri su Google Maps'}</a>`).join('')}<button class="btn" id="rSort" ${l.length<3?'disabled':''}>Ordina per vicinanza</button><button class="btn" id="rClr">Svuota</button></div>`;
}

/* ---------- importa luoghi da CSV (es. open data del Comune) ---------- */
function parseCSV(t){
  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/,1)[0];
  const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);if(r.some(x=>x!==''))rows.push(r)}
  return rows;
}
const numOf=v=>{const n=parseFloat(String(v==null?'':v).trim().replace(',','.'));return isFinite(n)?n:NaN};
function analyse(rows){
  if(rows.length<2)return {err:'Il file non contiene righe di dati.'};
  const hd=rows[0].map(h=>norm(h).replace(/[^a-z0-9]/g,''));
  const find=(ks,skip)=>hd.findIndex((h,i)=>!(skip||[]).includes(i)&&ks.some(k=>h===k||h.includes(k)));
  let iLat=hd.findIndex(h=>h.includes('lat')),iLon=hd.findIndex(h=>h.includes('lon')||h.includes('lng'));
  let iGeo=-1;
  if(iLat<0||iLon<0){const rx=/(\d{2}[.,]\d+)\s*[,;]\s*(\d{1,2}[.,]\d+)/;for(let c=0;c<hd.length&&iGeo<0;c++){if(rows.slice(1,6).some(r=>rx.test(r[c]||'')))iGeo=c}}
  if(iLat<0&&iLon<0&&iGeo<0)return {err:'Non trovo le coordinate: servono colonne latitudine e longitudine (oppure una colonna "lat, lon").'};
  const used=[iLat,iLon,iGeo];
  let iA=find(['indirizzo','address','ubicazione','via'],used),iN=find(['nome','denominazione','ragionesociale','name','titolo','ente','struttura','associazione'],used.concat([iA]));
  if(iN<0)iN=hd.findIndex((h,i)=>!used.includes(i)&&i!==iA);
  if(iN<0)return {err:'Non trovo la colonna con il nome del luogo.'};
  const items=[];let outside=0,noCoord=0,dup=0;
  rows.slice(1).forEach(r=>{
    const name=(r[iN]||'').trim();let lat,lon;
    if(iGeo>=0){const m=(r[iGeo]||'').match(/(\d{2}[.,]\d+)\s*[,;]\s*(\d{1,2}[.,]\d+)/);if(m){lat=numOf(m[1]);lon=numOf(m[2])}}
    else{lat=numOf(r[iLat]);lon=numOf(r[iLon])}
    if(!name||!isFinite(lat)||!isFinite(lon)){noCoord++;return}
    if(lat<20&&lon>40){const t=lat;lat=lon;lon=t}
    if(!munOf(lon,lat)){outside++;return}
    const nn=norm(name);
    if(ALL.some(p=>norm(p.name)===nn&&Math.abs(p.lat-lat)<.0005&&Math.abs(p.lon-lon)<.0005)||items.some(i=>norm(i.name)===nn&&Math.abs(i.lat-lat)<.0005&&Math.abs(i.lon-lon)<.0005)){dup++;return}
    items.push({name:name.slice(0,120),street:iA>=0?(r[iA]||'').trim().slice(0,120):'',lat,lon});
  });
  return {items,outside,noCoord,dup};
}
function readImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let txt=new TextDecoder('utf-8').decode(fr.result);
    if(txt.includes(String.fromCharCode(65533)))txt=new TextDecoder('windows-1252').decode(fr.result);
    const a=analyse(parseCSV(txt));
    imp=a.err?{err:a.err}:Object.assign(a,{cat:'associazioni',file:file.name});
    drawImp();
  };
  fr.onerror=()=>toast('Non riesco a leggere il file.');
  fr.readAsArrayBuffer(file);
}
function drawImp(){
  const b=$('#impBox');if(!b)return;
  if(!imp){b.innerHTML='';return}
  if(imp.err){b.innerHTML=`<div class="ro">${esc(imp.err)}</div>`;return}
  const big=imp.items.length>1500;
  b.innerHTML=`<div class="ro"><b>${esc(imp.file)}</b>: ${imp.items.length} luoghi nuovi dentro Milano. Esclusi: ${imp.dup} già presenti, ${imp.outside} fuori Milano, ${imp.noCoord} senza nome o coordinate.</div>
  ${imp.items.length?`<label class="fld">Tipo di luogo per tutti i nuovi punti<select id="iCat">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===imp.cat?'selected':''}>${c[1]}</option>`).join('')}</select></label>
  <div class="row">${big?'<span class="meta">Troppi luoghi in una volta (massimo 1500): dividi il file.</span>':`<button class="btn pri" id="iGo">Importa ${imp.items.length} luoghi</button>`}<button class="btn" id="iNo">Annulla</button></div>`:'<div class="row"><button class="btn" id="iNo">Chiudi</button></div>'}`;
}
async function doImport(){

  const items=imp.items,cat=imp.cat;let ok=0;
  $('#iGo').disabled=true;$('#iGo').textContent='Importo…';

}

const PL_FACTOR=1.3,PL_SPEED={walk:4.5,bike:13,car:17},PL_FIX={walk:0,bike:0,car:3};
const PL_DUR={scuole:30,universita:30,cultura:30,biblioteche:25,spettacolo:20,musei:40,associazioni:30,culto:15,sanita:20,sport:25,mercati:25};
function plKm(a,b){const t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t,x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(x)))}
/* minuti di spostamento: linea d'aria x 1,3 / velocità, arrotondati per eccesso, + attesa fissa per l'auto; 0 se i punti coincidono */
function plLeg(a,b,mode){const km=plKm(a,b);if(km<0.001)return 0;return Math.ceil(km*PL_FACTOR/PL_SPEED[mode]*60-1e-9)+PL_FIX[mode]}
function plHM(s){const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1]*60+ +m[2]):null}
function plFmt(m){m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
/* orari di un luogo: null = non indicati; altrimenti {o:apertura,c:chiusura (minuti),days:'12345' ('' = tutti i giorni)} */
function plHours(ho,hc,hd){
  if(!ho&&!hc&&!hd)return null;
  let o=plHM(ho),c=plHM(hc);if(o==null)o=0;if(c==null)c=1440;
  if(c<=o)return null;
  return {o,c,days:hd||''};
}
/* finestra del giorno (1=lun ... 7=dom): null = chiuso quel giorno; senza orari sempre aperto */
function plWin(h,day){
  if(!h)return {o:0,c:Infinity};
  if(h.days&&h.days.length<7&&h.days.indexOf(String(day))<0)return null;
  return {o:h.o,c:h.c};
}
function plScore(prio,due){return (prio==='alta'?3:prio==='media'?2:1)+(due?2:0)}
function plNode(p,s,o){
  s=s||{};const due=!!(s.recall&&s.recall<=o.dayStr);
  return {id:p.id,name:p.name,cat:p.cat,mun:p.mun,lat:p.lat,lon:p.lon,street:p.street||'',dur:(o.durs&&o.durs[p.cat])||PL_DUR[p.cat]||30,score:plScore(s.prio,due),due,hours:plHours(s.ho,s.hc,s.hd)};
}
/* luoghi candidati secondo i filtri. o: {cats,muns,prio:'tutte'|'altamedia'|'alta',inc:'todo'|'recall',dayStr,durs} */
function plCandidates(places,stOf,o){
  const out=[];
  for(const p of places){
    const s=stOf(p.id)||{};
    if(s.hidden)continue;
    if(o.cats&&o.cats.length&&o.cats.indexOf(p.cat)<0)continue;
    if(o.muns&&o.muns.length&&o.muns.indexOf(p.mun)<0)continue;
    const pr=s.prio||'';
    if(o.prio==='alta'&&pr!=='alta')continue;
    if(o.prio==='altamedia'&&pr!=='alta'&&pr!=='media')continue;
    const due=!!(s.recall&&s.recall<=o.dayStr);
    if(s.v&&!(o.inc==='recall'&&due))continue;
    out.push(plNode(p,s,o));
  }
  return out;
}
/* Motore. inp: {start:{lat,lon},startMin,day(1-7),budget(min),mode,ret,pool:[nodi candidati],extra:[nodi presenti nel giro ma non candidati],locked:[id],maxStops}
   Euristica dell'orienteering: inserimento che massimizza punteggio/tempo marginale, poi 2-opt, poi riempimento del tempo residuo. Deterministica. */
function plEngine(inp){
  const mode=inp.mode||'walk',ret=!!inp.ret,t0=inp.startMin,budget=inp.budget,dl=t0+budget,day=inp.day||1,maxS=inp.maxStops||99;
  const byId=new Map();
  (inp.pool||[]).forEach(n=>byId.set(n.id,{n,el:true}));
  (inp.extra||[]).forEach(n=>{if(!byId.has(n.id))byId.set(n.id,{n,el:false})});
  const ids=[...byId.keys()].sort();
  const nodes=[{lat:inp.start.lat,lon:inp.start.lon,dur:0,id:'#start'}],idx=new Map(),el=[false];
  ids.forEach(id=>{idx.set(id,nodes.length);nodes.push(byId.get(id).n);el.push(byId.get(id).el)});
  const N=nodes.length,M=new Int16Array(N*N).fill(-1);
  const T=(a,b)=>{const k=a*N+b;let v=M[k];if(v<0){v=plLeg(nodes[a],nodes[b],mode);M[k]=v}return v};
  const W=nodes.map(n=>plWin(n.hours,day));
  const locked=(inp.locked||[]);
  /* fine giro (compreso il ritorno) oppure -1 se viola tempo o orari */
  function run(seq){
    let t=t0,p=0;
    for(let k=0;k<seq.length;k++){
      const i=seq[k],w=W[i];if(!w)return -1;
      const a=t+T(p,i),s=a>w.o?a:w.o,e=s+nodes[i].dur;
      if(e>w.c||e>dl)return -1;
      t=e;p=i;
    }
    if(ret)t+=T(p,0);
    return t>dl?-1:t;
  }
  const cand=[];
  for(let i=1;i<N;i++){if(!el[i]||!W[i])continue;if(T(0,i)+nodes[i].dur+(ret?T(i,0):0)<=budget)cand.push(i)}
  function grow(seq,limit){
    while(seq.length<limit){
      const base=run(seq),inS=new Set(seq);let best=null;
      for(const i of cand){
        if(inS.has(i))continue;
        const sc=nodes[i].score;
        for(let p=0;p<=seq.length;p++){
          seq.splice(p,0,i);const e=run(seq);seq.splice(p,1);
          if(e<0)continue;
          const r=sc/Math.max(e-base,1);
          if(!best||r>best.r+1e-9||(r>best.r-1e-9&&sc>best.sc))best={i,p,r,sc};
        }
      }
      if(!best)break;
      seq.splice(best.p,0,best.i);
    }
    return seq;
  }
  function twoOpt(seq){
    let best=run(seq),improved=true,guard=0;
    while(improved&&guard++<60){
      improved=false;
      for(let i=0;i<seq.length-1;i++)for(let j=i+1;j<seq.length;j++){
        const c=seq.slice(0,i).concat(seq.slice(i,j+1).reverse(),seq.slice(j+1)),e=run(c);
        if(e>=0&&e<best){seq=c;best=e;improved=true}
      }
    }
    return seq;
  }
  /* calendario del giro, anche se non rispetta tempo/orari (segnala i problemi) */
  function timeline(list){
    const legs=[],problems=[];let t=t0,p=0,trav=0,vis=0,wait=0,km=0,ok=true;
    list.forEach(id=>{
      const i=idx.get(id);if(!i)return;
      const n=nodes[i],w=W[i],tr=T(p,i),arr=t+tr;let s=arr,flag='';
      km+=plKm(nodes[p],n)*PL_FACTOR;
      if(!n.hours)flag='nohours';
      else if(!w)flag='closed';
      else if(arr<w.o)s=w.o;
      const e=s+n.dur;
      if(w&&n.hours&&e>w.c)flag='late';
      if(flag==='closed'||flag==='late'){ok=false;problems.push({id,flag})}
      legs.push({id,travel:tr,arrive:arr,wait:s-arr,start:s,end:e,flag});
      trav+=tr;vis+=n.dur;wait+=s-arr;t=e;p=i;
    });
    let back=0;
    if(ret&&legs.length){back=T(p,0);km+=plKm(nodes[p],nodes[0])*PL_FACTOR;trav+=back;t+=back}
    if(t>dl){ok=false;problems.push({flag:'time',over:t-dl})}
    return {legs,back,end:t,deadline:dl,left:dl-t,travel:trav,visit:vis,wait,km,ok,problems,startMin:t0,ret};
  }
  function full(){
    const lk=locked.map(id=>idx.get(id)).filter(Boolean);
    const eligible=ids.filter(id=>byId.get(id).el&&locked.indexOf(id)<0).length+lk.length;
    if(eligible===0)return {ok:false,reason:'nocand'};
    if(eligible<2)return {ok:false,reason:'few',n:eligible};
    let seq=lk.slice();
    if(seq.length&&run(seq)<0)return {ok:false,reason:'locked'};
    const lim=Math.max(maxS,seq.length);
    grow(seq,lim);seq=twoOpt(seq);grow(seq,lim);seq=twoOpt(seq);
    if(!seq.length){
      let need=Infinity;
      for(let i=1;i<N;i++)if(el[i])need=Math.min(need,T(0,i)+nodes[i].dur+(ret?T(i,0):0));
      return need>budget?{ok:false,reason:'short',need}:{ok:false,reason:'closed'};
    }
    const out=seq.map(i=>nodes[i].id);
    return {ok:true,ids:out,tl:timeline(out)};
  }
  /* aggiunge, se c'è tempo, la migliore tappa in più (ignora il massimo di tappe) */
  function addOne(list){
    const seq=list.map(id=>idx.get(id)).filter(Boolean);
    if(run(seq)<0)return null;
    const n0=seq.length;grow(seq,n0+1);
    if(seq.length===n0)return null;
    const r=twoOpt(seq);
    return r.map(i=>nodes[i].id);
  }
  /* alternative alla tappa k: luoghi vicini che entrano nel giro al suo posto, dalla migliore */
  function alts(list,k){
    const cur=idx.get(list[k]),all=list.map(id=>idx.get(id)),rest=all.filter((_,j)=>j!==k),inS=new Set(all),out=[];
    if(!cur)return out;
    for(const i of cand){
      if(inS.has(i))continue;
      let bestE=Infinity,bestP=-1;
      for(let p=0;p<=rest.length;p++){rest.splice(p,0,i);const e=run(rest);rest.splice(p,1);if(e>=0&&e<bestE){bestE=e;bestP=p}}
      if(bestP<0)continue;
      const seq=rest.slice();seq.splice(bestP,0,i);
      const km=plKm(nodes[cur],nodes[i]);
      out.push({id:nodes[i].id,e:bestE,km,u:nodes[i].score/(1+km),ids:seq.map(j=>nodes[j].id)});
    }
    out.sort((a,b)=>b.u-a.u||a.e-b.e||(a.id<b.id?-1:1));
    return out.slice(0,5);
  }
  return {full,timeline,addOne,alts,run:list=>run(list.map(id=>idx.get(id)))};
}

function plMove(id,d){

function plOpenSaved(id){
  const r=routesMap.get(id);if(!r)return;
  const ids=(r.ids||[]).filter(x=>placeById(x));
  if(ids.length!==(r.ids||[]).length)toast('Alcuni luoghi di questo giro non esistono più: li ho tolti.');
  route=ids;PL.locked=(r.locked||[]).filter(x=>ids.indexOf(x)>=0);PL.excl=[];PL.fail=null;PL.alt=null;PL.msg='';PL.arm='';
  PL.snap=r.snap||null;
  if(PL.snap){const s=PL.snap;PL.start=s.start;PL.mode=s.mode;PL.ret=s.ret;PL.durs=Object.assign({},s.durs);PL.cats=s.f.cats.slice();PL.muns=s.f.muns.slice();PL.prio=s.f.prio;PL.inc=s.f.inc;PL.max=s.f.max;PL.day=s.day;PL.time=plFmt(s.startMin);PL.touched=true;PL.pre='cust';PL.cH=Math.floor(s.budget/60);PL.cM=s.budget%60}
  PL.tab='res';saveRoute();fitRoute();plRender();
}
function plArm(k){PL.arm=k;clearTimeout(plArm.t);plArm.t=setTimeout(()=>{PL.arm='';plRender()},4000);plRender()}
$('#plan').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a!=='clr'&&a!=='del'&&PL.arm){PL.arm=''}
  PL.msg='';
  switch(a){
    case'tab':PL.tab=b.dataset.t;if(PL.tab==='form')PL.fail=null;plRender();break;
    case'go':plGo(false);break;
    case'recalc':plGo(true);break;
    case'pre':PL.pre=b.dataset.p;PL.touched=true;if(PL.pre==='mat')PL.time='09:00';if(PL.pre==='pom')PL.time='14:00';PL.err.bud='';plSaveLocal();plRender();break;
    case'mode':PL.mode=b.dataset.m;plSaveLocal();plRender();break;
    case'ret':PL.ret=b.dataset.r==='1';plSaveLocal();plRender();break;
    case'cat':{const c=b.dataset.c,i=PL.cats.indexOf(c);if(i>=0)PL.cats.splice(i,1);else PL.cats.push(c);plSaveLocal();plRender();break}
    case'mun':{const n=+b.dataset.n,i=PL.muns.indexOf(n);if(i>=0)PL.muns.splice(i,1);else PL.muns.push(n);plSaveLocal();plRender();break}
    case'prio':PL.prio=b.dataset.v;plSaveLocal();plRender();break;
    case'inc':PL.inc=b.dataset.v;plSaveLocal();plRender();break;
    case'durreset':PL.durs={};plSaveLocal();plRender();$('#plBody .pld').open=true;break;
    case'lm':{const l=LANDMARKS.find(x=>x[0]===b.dataset.k);plStart(l[1],l[2],LMK[l[0]]);break}
    case'pl':{const p=placeById(id);if(p)plStart(p.lat,p.lon,p.name);break}
    case'clrs':PL.start=null;plSaveLocal();plRender();{const q=$('#plQ');if(q)q.focus()}break;
    case'pickstart':plPickBegin();break;
    case'geo':plGeo();break;
    case'seemap':plClose();break;
    case'goto':{const p=placeById(id);if(p){if(mq.matches)plClose();select(id,true)}break}
    case'lock':{const i=PL.locked.indexOf(id);if(i>=0)PL.locked.splice(i,1);else PL.locked.push(id);plSaveLocal();plRender();break}
    case'up':plMove(id,-1);break;
    case'down':plMove(id,1);break;
    case'rm':PL.alt=null;if(PL.snap&&PL.excl.indexOf(id)<0)PL.excl.push(id);toggleRoute(id);break;
    case'rep':plRep(id);break;
    case'repok':plRepOk();break;
    case'repnext':PL.alt.i=(PL.alt.i+1)%PL.alt.list.length;plRender();break;
    case'repno':PL.alt=null;plRender();break;
    case'addone':plAdd();break;
    case'copy':plCopy();break;
    case'savert':plSaveRoute();break;
    case'clr':if(PL.arm!=='clr'){plArm('clr');break}PL.arm='';PL.excl=[];route=[];PL.locked=[];PL.alt=null;saveRoute();plRender();break;
    case'open':plOpenSaved(id);break;
    case'del':if(PL.arm!=='del:'+id){plArm('del:'+id);break}PL.arm='';if(db)db.doc('routes/'+id).delete().catch(()=>toast('Eliminazione non riuscita.'));routesMap.delete(id);plBadge();plRender();toast('Giro eliminato.');break;
  }
});
$('#plan').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='plQ'){PL.q=t.value;plResults()}
  else if(t.id==='plD'){PL.day=t.value;PL.touched=true;PL.err.time='';$('#e_time').textContent='';plCount()}

  else if(t.id==='plCM'){PL.cM=t.value;PL.err.bud='';$('#e_bud').textContent='';plUpdBud();plSaveLocal()}
  else if(t.id==='plMax'){PL.max=t.value===''?'':+t.value;$('#e_max').textContent='';plSaveLocal()}

});
